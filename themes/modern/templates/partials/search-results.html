<template data-search-result-template>
  <article class="post-summary search-result" data-search-card>
    <span class="post-summary__number" aria-hidden="true"></span>
    <div class="post-summary__body">
      <h2><a data-search-title data-search-link href=""></a></h2>
      <div class="post-summary__meta">
        <time data-search-date datetime=""></time>
        <a class="post-permalink" data-search-link href="">Permalink</a>
        <span data-search-tags></span>
      </div>
      <p data-search-summary></p>
    </div>
  </article>
</template>
