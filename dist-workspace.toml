[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# release.yml is generated from cargo-dist and then intentionally customized
# for manual dispatch and safer GitHub release metadata parsing.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "vrypan/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Bundle the themes into every release archive so `bckt init` and
# `bckt themes use <name>` work offline. Each directory lands at the archive
# root (e.g. bckt3/), which the theme search path resolves via the directory
# containing the executable.
include = [
    "themes/bckt3",
    "themes/micro",
    "themes/microx",
    "themes/modern",
    "themes/plain",
    "themes/rntz",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = false
