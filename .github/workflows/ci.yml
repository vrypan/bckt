name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: test
        run: cargo test
      # The `post` module is published for companion tools that depend on this
      # crate with `default-features = false`. Nothing in the normal build
      # exercises that path, so it would rot silently without these two steps.
      - name: clippy (post only)
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: test (post only)
        run: cargo test --no-default-features
